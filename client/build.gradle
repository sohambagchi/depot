// depot's client, included by an app's settings.gradle.kts as the `:depot` project from a
// writable copy of this directory (see ../README.md). Groovy rather than Kotlin DSL: it has to
// build under whatever AGP the app uses (8.x with the Kotlin plugin, 9.x with built-in Kotlin),
// and the client itself is plain Java.

plugins {
    id 'com.android.library'
}

// Compile against the newest platform and build-tools in the app's SDK (a read-only Nix SDK can't fetch another).
def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
def platform = sdkDir ? new File(sdkDir, 'platforms').list()?.findAll { it ==~ /android-\d+(\.\d+)?/ }
        ?.max { it.substring(8).tokenize('.').collect { it as int }.with { it[0] * 100 + (it.size() > 1 ? it[1] : 0) } } : null
if (platform == null) throw new GradleException("depot: no platform under \$ANDROID_HOME/platforms")
def (sdkMajor, sdkMinor) = platform.substring(8).tokenize('.').collect { it as int } + [0]
def buildTools = new File(sdkDir, 'build-tools').list()?.findAll { it ==~ /\d+\.\d+\.\d+/ }
        ?.max { it.tokenize('.').collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] } }

// Where the server is: DEPOT_URLS from the dev shell (android-emu's lib.depotEnv), or -Pdepot.urls.
def urls = findProperty('depot.urls') ?: System.getenv('DEPOT_URLS') ?: ''

// The only hosts the app may reach over plain HTTP: those of depot's http:// URLs, plus any the
// app lists in DEPOT_CLEARTEXT_HOSTS or -Pdepot.cleartextHosts (separated by commas or spaces).
def extraHosts = findProperty('depot.cleartextHosts') ?: System.getenv('DEPOT_CLEARTEXT_HOSTS') ?: ''
def cleartextHosts = (urls.split(',').findAll { it.trim().startsWith('http://') }.collect { new URI(it.trim()).host }
        + extraHosts.split(/[,\s]+/).findAll { it }).unique().sort()

/** Writes res/xml/depot_network_security.xml: cleartext off, except to `hosts`. */
abstract class DepotNetworkSecurityConfig extends DefaultTask {
    @Input abstract ListProperty<String> getHosts()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction void write() {
        def xml = outputDir.get().dir('xml').asFile
        xml.mkdirs()
        def domains = hosts.get().collect {
            "    <domain-config cleartextTrafficPermitted=\"true\">\n        <domain includeSubdomains=\"false\">${it}</domain>\n    </domain-config>\n"
        }.join()
        new File(xml, 'depot_network_security.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by depot's client (build.gradle). -->
<network-security-config>
    <base-config cleartextTrafficPermitted="false" />
${domains}</network-security-config>
"""
    }
}

def networkSecurity = tasks.register('depotNetworkSecurityConfig', DepotNetworkSecurityConfig) {
    hosts.set(cleartextHosts)
    outputDir.set(layout.buildDirectory.dir('generated/depot/res'))
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(networkSecurity, DepotNetworkSecurityConfig::getOutputDir)
    }
}

android {
    namespace 'com.sohambagchi.depot'
    if (sdkMinor > 0) {
        // AGP 9's form for minor API levels such as 37.2.
        compileSdk { version = release(sdkMajor) { minorApiLevel = sdkMinor } }
    } else {
        compileSdk = sdkMajor
    }
    if (buildTools) buildToolsVersion = buildTools

    defaultConfig {
        minSdk 31
        buildConfigField 'String', 'DEPOT_URLS', "\"${urls}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
