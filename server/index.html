<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depot</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f5d50; --accent-ink: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1e1e1c; --ink: #ecece8; --muted: #9a9a94; --line: #2e2e2b;
            --accent: #7fb8a6; --accent-ink: #10201b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
         padding: 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .names { flex: 1; min-width: 0; }
  .label { font-weight: 600; font-size: 17px; }
  .id { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .get { flex: none; background: var(--accent); color: var(--accent-ink); text-decoration: none;
         font-weight: 600; padding: 10px 16px; border-radius: 10px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .notes { font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .hash { font: 11px/1.4 ui-monospace, monospace; color: var(--muted); margin-top: 8px;
          overflow-wrap: anywhere; }
  .msg { color: var(--muted); padding: 16px 0; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
         text-transform: uppercase; color: var(--muted); border: 1px solid var(--line);
         border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; border-top: 1px solid var(--line);
           padding-top: 16px; }
  footer p { margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>depot</h1>
  <p class="lede">Apps for your devices. Tap one to download and install it.</p>
  <div id="apps"><p class="msg">Loading…</p></div>
  <footer>
    <p>Android asks once to allow installs from your browser.</p>
    <p>After installing, open the app once with Tailscale on. It enrolls then, and gets its
       updates from here afterwards.</p>
  </footer>
</main>
<script>
  const list = document.getElementById("apps");
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const message = text => list.replaceChildren(el("p", "msg", text));
  const mb = n => n < 1048576 ? Math.ceil(n / 1024) + " KB" : (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";
  const day = ms => new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

  fetch("/v1/catalog")
    .then(r => r.ok ? r.json() : r.json().then(b => Promise.reject(new Error(b.error || r.status))))
    .then(({ apps }) => {
      if (!apps.length) return message("Nothing published yet.");
      const card = a => {
        const card = el("div", "app");
        const row = el("div", "row");
        const names = el("div", "names");
        const label = el("div", "label", a.label);
        if (a.build === "debug") label.append(el("span", "tag", "debug"));
        names.append(label, el("div", "id", a.app));
        const get = el("a", "get", "Download");
        get.href = a.url;
        get.setAttribute("download", "");
        row.append(names, get);
        card.append(row, el("div", "meta", `${a.name || "build " + a.code} · ${mb(a.size)} · ${day(a.published_at)}`));
        if (a.notes) card.append(el("div", "notes", a.notes));
        card.append(el("div", "hash", "sha256 " + a.sha256));
        return card;
      };
      const release = apps.filter(a => a.build !== "debug"), debug = apps.filter(a => a.build === "debug");
      const parts = release.map(card);
      if (debug.length) {
        parts.push(el("h2", null, "Debug builds"),
                   el("p", "sub", "Separate apps that install alongside the release ones."),
                   ...debug.map(card));
      }
      list.replaceChildren(...parts);
    })
    .catch(e => message("Can't list apps: " + e.message));
</script>
</body>
</html>
